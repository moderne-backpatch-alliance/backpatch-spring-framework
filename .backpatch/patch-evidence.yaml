    note: "New in this release; ported onto 5.3.39; fixed at 5.3.39.1-backpatch-00020 (backpatch-spring-framework@efd94fe). Behaviour change, as upstream: the WebFlux XML decoders' maxInMemorySize now bounds the bytes behind each split element; XmlEventDecoder used on its own no longer applies a limit, and setMaxInMemorySize(0) on the Aalto path rejects every element."
